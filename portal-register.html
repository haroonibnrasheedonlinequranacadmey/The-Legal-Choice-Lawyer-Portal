<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | The Legal Choice Portal</title><link rel="stylesheet" href="portal.css"></head><body><div class="login-wrap"><section class="login-visual"><div><div class="muted" style="color:#d7b65d;letter-spacing:2px;text-transform:uppercase">Create your account</div><h1>One Portal.<br>Every Legal Matter.</h1><p>Register as a lawyer or client and access a clean, responsive legal management experience.</p><a class="btn gold" href="index.html">← Back to Website</a></div></section><section class="login-card"><div class="auth"><div class="auth-brand"><img src="assets/logo.png" alt="Logo"><h1>Create Your Account</h1><p>JUSTICE · TRUST · SUPPORT</p></div><form class="authbox" onsubmit="registerDemo(event)"><div style="display:flex;gap:8px;margin-bottom:16px"><button type="button" class="btn" style="flex:1">⚖ Lawyer</button><button type="button" class="btn light" style="flex:1">♙ Client</button></div><div class="field"><label>Full Name</label><input required placeholder="Full name"></div><div class="field" style="margin-top:11px"><label>Email Address</label><input required type="email" placeholder="name@example.com"></div><div class="field" style="margin-top:11px"><label>Phone Number</label><input placeholder="+92 3xx xxxxxxx"></div><div class="field" style="margin-top:11px"><label>Password</label><input required type="password" placeholder="Create password"></div><div class="field" style="margin-top:11px"><label>Confirm Password</label><input required type="password" placeholder="Confirm password"></div><button class="btn gold" style="width:100%;margin-top:16px" type="submit">Register</button><div class="authfoot">Already have an account? <a href="portal-login.html">Login</a></div></form></div></section></div><script src="portal.js"></script></body></html>
